<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Module - Day Planner Matrix</title>
    <!-- Google Fonts Framework Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons Framework Asset -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../../style.css">       <!-- Global root styles -->
    <link rel="stylesheet" href="./planner-style.css">   <!-- Day Planner unique styles -->

    <style>
        /* Specific Flexbox Alignment for Top Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }
        .portal-top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-back-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title {
            margin: 0;
            text-align: right;
        }
        .planner-actions-row {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
        }
        .planner-actions-row .open-task-dialog-btn {
            flex: 1;
        }
    </style>
    <link rel="stylesheet" href="../AI_Coach/coach-style.css">
</head>
<body class="cyberpunk-portal-body">

    <!-- Top Fixed Status Ribbon HUD Header Banner -->
    <header class="top-nav">
        <div class="portal-top-hud">
            <div class="nav-back-control">
                <a href="../index.html" class="back-link-btn"><i class="fa-solid fa-circle-arrow-left"></i> Features Hub</a>
            </div>
            <h1 class="page-title">Day Planner</h1>
        </div>
    </header>

    <!-- Main Content Workspace Area Frame -->
        <main class="portal-main-content">

        <!-- 📅 CALENDAR & DATE SELECTOR RIBBON -->
        <section class="planner-calendar-ribbon">
            <div class="date-navigator-bar">
                <button type="button" class="date-nav-arrow" id="btnPrevDay" title="Previous Day">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="current-date-badge-box" id="btnOpenCalendarModal" title="Click to open calendar">
                    <i class="fa-regular fa-calendar-days" style="color: #00e5ff; font-size: 1.15rem;"></i>
                    <div class="date-text-group">
                        <span class="date-headline" id="plannerDisplayDateText">Today</span>
                        <span class="date-subline" id="plannerDisplayFullDate">Loading date...</span>
                    </div>
                    <i class="fa-solid fa-angle-down" style="color: #64748b; font-size: 0.8rem; margin-left: 4px;"></i>
                </div>
                <button type="button" class="date-nav-arrow" id="btnNextDay" title="Next Day">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            <div class="quick-date-chips" id="quickDateChips">
                <button type="button" class="date-chip active" data-offset="0">Today</button>
                <button type="button" class="date-chip" data-offset="1">Tomorrow</button>
                <button type="button" class="date-chip" data-offset="2">In 2 Days</button>
                <button type="button" class="date-chip" data-offset="7">Next Week</button>
                <button type="button" class="date-chip" id="btnQuickOpenCal"><i class="fa-regular fa-calendar"></i> Month Grid</button>
            </div>
        </section>

        <!-- 1. 📊 THE MASTER STATUS BAR (BORDERLESS & NO DIVISIONS) -->
        <section class="master-timeline-bar-section">
            <span class="section-micro-label">24h Visual Master Routine Track</span>
            <div class="master-blueprint-rail">
                <div class="fluid-neon-fill-container" id="masterNeonFillTrack">
                    <!-- Dynamic absolute color segments block elements injected here -->
                </div>
            </div>
            <div class="rail-time-labels">
                <span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span>
            </div>
        </section>

        <!-- 2. 📋 CHRONOLOGICAL AUTO-SORTING TASK LIST -->
        <section class="chronological-list-section neon-white-glow-backing">
            <div class="todo-header-row">
                <div class="todo-title-label">Tasks List</div>
            </div>
            <div class="todo-items-bucket" id="plannerTaskBucket">
                <!-- Sorted cards display rows drop inside here automatically -->
            </div>
        </section>

        <!-- Action Buttons Row (Add & Edit) -->
        <div class="planner-actions-row">
            <button class="open-task-dialog-btn" id="openTaskDialogBtn" type="button">
                <i class="fa-solid fa-plus"></i> Add Tasks
            </button>
            <button class="open-task-dialog-btn edit-task-btn" id="openEditTaskDialogBtn" type="button" style="border-color: rgba(255, 179, 0, 0.4); color: #ffb300; opacity: 0.5; pointer-events: none;" disabled>
                <i class="fa-solid fa-pen-to-square"></i> Edit Task
            </button>
        </div>

            <!-- 📅 FULL MONTHLY CALENDAR MODAL -->
        <dialog id="plannerCalendarModal" class="planner-calendar-modal">
            <div class="cal-modal-card">
                <div class="cal-modal-header">
                    <button type="button" class="cal-month-nav" id="btnCalPrevMonth">&lt;</button>
                    <div class="cal-month-title" id="calMonthTitleText">November 2026</div>
                    <button type="button" class="cal-month-nav" id="btnCalNextMonth">&gt;</button>
                    <button type="button" class="cal-close-btn" id="btnCloseCalModal">&times;</button>
                </div>
                <div class="cal-weekdays-grid">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div class="cal-days-grid" id="calDaysGrid">
                    <!-- Days dynamically rendered with task indicator dots -->
                </div>
                <div class="cal-modal-footer">
                    <button type="button" class="btn-cal-today" id="btnCalJumpToday">Jump to Today</button>
                </div>
            </div>
        </dialog>
    </main>

    <!-- Task Builder Dialog / Modal Wrapper -->
    <dialog id="taskBuilderDialog" class="task-builder-dialog">
        <form method="dialog" class="dialog-close-form">
            <button type="submit" class="dialog-x-close-btn">&times;</button>
        </form>
        
        <!-- Original Task Builder Box Container -->
        <section class="task-builder-palette-deck neon-white-glow-backing">
            <span class="section-micro-label" id="taskBuilderDeckTitle">Configure Target Objective Parameters</span>
            
                        <!-- Target Scheduled Date Banner -->
            <div class="builder-target-date-row" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: rgba(0, 229, 255, 0.08); border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 10px; margin-bottom: 12px;">
                <div style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #94a3b8; font-weight: 700;">
                    <i class="fa-regular fa-calendar-check" style="color: #00e5ff;"></i> Scheduled Date:
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="taskBuilderTargetDate" style="font-size: 0.82rem; font-weight: 800; color: #00e5ff;">Today</span>
                    <input type="date" id="taskBuilderDateInput" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(0,229,255,0.3); color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 0.75rem; font-family: inherit; color-scheme: dark; cursor: pointer;">
                </div>
            </div>

            <!-- Category Select Tabs Row -->
            <div class="menu-tabs-row">
                <button type="button" class="type-tab-btn active" data-type="academics">Academics</button>
                <button type="button" class="type-tab-btn" data-type="skills">Skills</button>
                <button type="button" class="type-tab-btn" data-type="health">Health</button>
                <button type="button" class="type-tab-btn" data-type="other">Other</button>
            </div>

            <!-- Optional Short Description Bar Input Box Field -->
            <div class="drawer-description-bar">
                <input type="text" id="taskDescriptionInput" placeholder="Add optional task description note here first...">
            </div>

            <!-- Preset Action Selection Decks -->
            <div class="sub-buttons-row academics" id="options-academics">
                <button type="button" data-task="Lecture">Lecture</button>
                <button type="button" data-task="Revision">Revision</button>
                <button type="button" data-task="Question Practice">Question Practice</button>
                <button type="button" class="custom-task-btn" data-task="custom"><i class="fa-solid fa-plus"></i> Custom Task</button>
            </div>

            <div class="sub-buttons-row skills" id="options-skills" style="display: none;">
                <button type="button" data-task="Technical">Technical</button>
                <button type="button" data-task="Physical">Physical</button>
                <button type="button" data-task="Something New">Something New</button>
                <button type="button" class="custom-task-btn" data-task="custom"><i class="fa-solid fa-plus"></i> Custom Task</button>
            </div>

            <div class="sub-buttons-row health" id="options-health" style="display: none;">
                <button type="button" data-task="Running">Running</button>
                <button type="button" data-task="Exercise">Exercise</button>
                <button type="button" class="custom-task-btn" data-task="custom"><i class="fa-solid fa-plus"></i> Custom Task</button>
            </div>

            <div class="sub-buttons-row other" id="options-other" style="display: none;">
                <button type="button" data-task="Routine Work">Routine Work</button>
                <button type="button" data-task="Relaxation">Rest / Relax</button>
                <button type="button" class="custom-task-btn" data-task="custom"><i class="fa-solid fa-plus"></i> Custom Task</button>
            </div>

            <!-- DUAL 3D TOUCH-DRUM CLOCK SCROLL WHEELS GRID -->
            <div class="builder-time-grid-upgraded">
                
                <!-- WHEEL BLOCK 1: START TIME SELECTOR -->
                <div class="builder-row">
                    <label class="upgraded-time-title-label">Starting Time</label>
                    <div class="skeuo-3d-drum-container academics-glow-aura" id="startDrumContainer">
                        <div class="scroll-wheel-column-drum" id="wheelStartHours">
                            <div class="wheel-scroll-track-drum"></div>
                        </div>
                        <div class="wheel-separator-dots">:</div>
                        <div class="scroll-wheel-column-drum" id="wheelStartMinutes">
                            <div class="wheel-scroll-track-drum"></div>
                        </div>
                    </div>
                </div>

                <!-- WHEEL BLOCK 2: DURATION SELECTOR -->
                <div class="builder-row">
                    <label class="upgraded-time-title-label">Duration</label>
                    <div class="skeuo-3d-drum-container skills-glow-aura" id="durationDrumContainer">
                        <div class="scroll-wheel-column-drum" id="wheelDurationHours">
                            <div class="wheel-scroll-track-drum"></div>
                        </div>
                        <div class="wheel-separator-dots">h</div>
                        <div class="scroll-wheel-column-drum" id="wheelDurationMinutes">
                            <div class="wheel-scroll-track-drum"></div>
                        </div>
                        <div class="wheel-separator-dots" style="margin-left: -5px;">m</div>
                    </div>
                </div>

            </div>

            <!-- Reminder / Alarm Toggle Badge Row -->
            <div class="reminder-badge-row">
                <span class="reminder-badge-label"><i class="fa-solid fa-clock-rotate-left"></i> Session Alarm</span>
                <button type="button" class="reminder-toggle-badge is-on" id="taskReminderToggleBtn" title="Click to Toggle Reminder ON/OFF">
                    <i class="fa-solid fa-bell" id="taskReminderIcon"></i>
                    <span id="taskReminderStateLabel">Reminder ON</span>
                </button>
            </div>

            <!-- Error Notice Banner (Hidden by default) -->
            <div id="taskErrorNotice" class="custom-error-notice hidden" style="display: none;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="taskErrorMessage">Collision Error text goes here...</span>
            </div>

            <!-- Add to Planner Layout Button Trigger -->
            <button type="button" class="add-to-planner-btn" id="addToPlannerBtn">
                <i class="fa-solid fa-square-plus"></i> <span id="addToPlannerBtnText">Add To Planner Track</span>
            </button>

        </section>
    </dialog>

    <!-- Graphical Custom Modal Pop-up (native <dialog> for correct layered stacking order) -->
    <dialog id="customTaskModal" class="task-builder-dialog custom-task-sub-dialog">
        <div class="task-builder-palette-deck neon-white-glow-backing" style="border-color: #d500f9 !important; box-shadow: 0 0 35px rgba(213,0,249,0.25) !important;">
            <span class="section-micro-label" style="color: #d500f9 !important;">Design Custom Task Preset</span>
            
            <div class="modal-input-group" style="margin-top: 5px;">
                <label for="customTaskTitleInput">Enter Task Name:</label>
                <input type="text" id="customTaskTitleInput" placeholder="e.g. Solve 15 questions, Read chapter 2...">
            </div>

            <!-- Checkbox to save permanently -->
            <div class="modal-checkbox-group" style="display: flex; align-items: center; gap: 10px; margin-top: 6px;">
                <input type="checkbox" id="savePermanentCheckbox" style="width: 18px; height: 18px; accent-color: #d500f9; cursor: pointer;">
                <label for="savePermanentCheckbox" style="font-size: 0.78rem; font-weight: 700; color: #a0a0ab; text-transform: none; cursor: pointer;">Save to permanent category presets</label>
            </div>

            <div class="modal-actions-row" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px;">
                <button type="button" class="modal-btn cancel-btn" id="taskCancelBtn">Ignore</button>
                <button type="button" class="modal-btn confirm-btn" id="taskConfirmBtn" style="border-color: #d500f9; color: #d500f9;">Create Card</button>
            </div>
        </div>
    </dialog>

    <script src="../../native-bridge.js"></script>
    <script src="../../main-portal.js"></script>
    <script src="./planner-scripts.js"></script>
    <script src="../AI_Coach/coach-brain.js"></script>
    <script src="../AI_Coach/coach-ui.js"></script>
</body>
</html>
