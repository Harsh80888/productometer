name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.1 dist/Productometer.apk \
            --title "Productometer v1.1.1 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.1

          Maintenance release fixing Screen Time Manager execution.

          #### 🚀 Fixes in v1.1.1:
          - **🛠️ Screen Time Manager Fix:** Resolved syntax error in \`screen-scripts.js\` that prevented the Screen Time section from initializing and displaying app stats.
          - **⚡ Icon Caching Optimization:** Added in-memory concurrent icon cache in \`WebAppInterface.java\` to eliminate lag during usage stats queries.
          - **📱 Digital Wellbeing Screen Time:** Full foreground usage synchronization restored.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.1 dist/Productometer.apk --clobber
