name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.4 dist/Productometer.apk \
            --title "Productometer v1.1.4 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.4

          Enhanced screen time tracking algorithm based directly on high-accuracy v1.0.9 reference, with mobile UI alignment polish.

          #### 🚀 Highlights in v1.1.4:
          - **🎯 Enhanced Screen Time Accuracy (v1.0.9 Reference Engine):**
            - Reverted to and enhanced the authoritative v1.0.9 \`UsageEvents\` algorithm.
            - Pre-seeds active foreground sessions from 15 minutes prior to midnight, capturing midnight rollover sessions.
            - Restores top foreground application upon device unlock, recovering the 1-2 minute undercounting observed in v1.0.9.
            - Multi-launcher and system IME input method filtering to avoid counting background UI.
          - **📱 Android Mobile Alignment & UI Polish:**
            - Bedtime Mode time input boxes and pickers refined with \`box-sizing: border-box\` and responsive grid.
            - App Daily Limits header and tab navigation made horizontally scrollable with touch-momentum for all phone aspect ratios.
            - Active App Limit cards upgraded with responsive \`.limit-card-right\` and truncated \`.limit-app-name\` to eliminate mobile text clipping and wrapping.
            - Day Planner quick date chips and calendar day cells reinforced with \`min-height\` and \`flex-shrink: 0\`.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.4 dist/Productometer.apk --clobber
