name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.8 dist/Productometer.apk \
            --title "Productometer v1.1.8 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.8

          Major release featuring the new Sleep & Bedtime Monitoring system, interactive Showcase portal, Voice-first AI Coach with 5-turn memory & offline scheduling, and bedtime guardian protection.

          #### 🚀 Highlights in v1.1.8:
          - **📊 Real Device Screen Management & Digital Wellbeing Rollup:**
            - Resilient Android UsageStatsManager aggregation with multi-interval queries and rolling 24-hour fallback so device screen time never falsely reports zero.
            - Automatic live UI refresh on onResume, focus, and visibilitychange when returning from Android System Settings.
            - Protects cached non-zero screen time and sorts apps by foreground duration.
          - **🥗 Offline AI Coach Diet & Nutrition Engine:**
            - Natural language diet logger supporting number words (two rotis, three eggs, half a cup).
            - Robust intent parser matching colloquial phrases like 'adding two rotis two my diet', 'add 2 rotis to my diet', 'two chapatis', etc.
            - Comprehensive Indian staple nutrition database (roti, chapati, dal, paneer, curd, sabzi) updating Health Tracker macros in 0 ms offline.
          - **🤖 Voice-First AI Coach with 5-Turn Memory & Offline Scheduling:**
            - Animated voice-first listening mode on open with one-tap 'Chat instead' transition.
            - 5-prompt rolling conversational memory for context-aware multi-turn task scheduling.
          - **🌙 Sleep & Bedtime Monitoring Module:**
            - Calibrated circadian sleep target with real-time countdown and 50-step walking alarm.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.8 dist/Productometer.apk --clobber
