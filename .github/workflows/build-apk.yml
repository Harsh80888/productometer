name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.2 dist/Productometer.apk \
            --title "Productometer v1.0.2 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.2

          Major update featuring Day Planner task rendering fixes, Hardware Pedometer & GPS integration, Clean Screen Management app names, Compact mobile framing, and Home Screen Light & Dark mode toggle.

          #### 🚀 Enhancements & Bug Fixes:
          - **Day Planner Task Rendering Fix:** Resolved JavaScript ReferenceError on native bridge alarm dispatch; tasks now reliably save into local storage and render onto the chronological timeline and Home screen schedule.
          - **Hardware Pedometer & GPS Fix:** Activated native Android \`Sensor.TYPE_STEP_COUNTER\` / \`TYPE_STEP_DETECTOR\` bridge, motion sensor fallbacks, and \`WebChromeClient.onGeolocationPermissionsShowPrompt\` callback for outdoor GPS tracking.
          - **Clean Screen Management App Names:** Added Android \`QUERY_ALL_PACKAGES\` visibility and native package label resolver, replacing raw package identifiers (\`com.facebook.katana\`, \`com.google.android.youtube\`) with clean human labels (\"Facebook\", \"YouTube\", \"WhatsApp\").
          - **Compact Mobile Frame & Sizing:** Fixed excessive vertical length and screen zooming by disabling wide-viewport desktop emulation in Android WebView, compacting HUD (52px), bottom dock (54px), and optimizing card padding.
          - **Light & Dark Mode Switcher:** Added a one-tap theme toggle button directly on the Home screen top HUD with full CSS token adaptation and persistent storage across app launches.
          - **100% Offline Capability:** All assets and application logic remain fully offline and local.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.2 dist/Productometer.apk --clobber
