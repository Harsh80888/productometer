name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.6

          Major release delivering 100% reliable long video filtering in YouTube & mobile browsers, loud multi-stream bedtime alarm ringing with ToneGenerator emergency fallback, centralized sleep monitoring, and an A4-printable project writeout.

          #### 🚀 Highlights in v1.2.6:
          - **🎯 100% Reliable Long Video Filtering (YouTube App & Mobile Browsers):**
            - Universal accessibility detection identifies active watch pages using standard media controls (TalkBack "Pause video", "Play video", "Fullscreen", "Like this video") without depending on fragile view IDs.
            - Recommendation leak-proof title extractor strictly limits traversal to Child 0 & Child 1 of watch list containers, isolating the active video title and channel while ignoring recommended videos.
            - Stable signature evaluation prevents timer reset loops, ensuring uneducational long videos are intercepted after the 3.5s settle grace period.
            - Expanded 160+ Academic Keyword Library evaluated first so study lectures, NCERT/CBSE classes, and competitive exam solutions are always allowed.
          - **⏰ Loud Bedtime & Morning Wake-Up Alarm:**
            - Multi-stream volume boost sets both `STREAM_ALARM` and `STREAM_MUSIC` to maximum.
            - Redundant audio pipeline: Looping `MediaPlayer` with `USAGE_ALARM` -> `RingtoneManager` -> hardware `ToneGenerator` beeper ensures the alarm rings even on heavily customized OEM devices.
            - "Test 10-Shake Alarm" button directly triggers the native hardware alarm (`triggerWakeupAlarmNow()`), launching the full-screen `AlarmActivity` with 10-shake sensor verification.
          - **🌙 Centralized Sleep & Bedtime Monitoring:**
            - Removed all duplicate/conflicting bedtime options from Health Tracker and Screen Management.
            - Centralized exclusively in the Features tab under Sleep & Bedtime Monitoring (`Features/Sleep_Monitoring/`).
          - **📄 A4 Printable Project Writeout:**
            - Added print-ready A4 documentation and technical overview.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.2.6 dist/Productometer.apk \
            --title "Productometer v1.2.6 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.6 dist/Productometer.apk --clobber
