name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.5 dist/Productometer.apk \
            --title "Productometer v1.0.5 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.5

          Major update featuring ground-truth Android Screen Time tracking with authentic app logos, complete alarm song silencing, accurate real-time study time counter, dynamic session duration selector, system-wide Distraction Guardian with Gesture Navigation support, and cleaned Features grid.

          #### 🚀 Key Fixes & Features in v1.0.5:
          - **Screen Monitoring — Ground-Truth Device Screen Time & Real App Logos:**
            - Upgraded to dual-engine \`UsageEvents\` + \`queryUsageStats\` aggregator in Java; accurately captures all real application screen time directly from Android OS without open-interval aggregation drops.
            - Serializes native high-resolution app icons into Base64 PNG data URLs directly from Android's \`PackageManager\`, rendering original authentic logos for YouTube, WhatsApp, Instagram, Chrome, Camera, Games, etc.
            - Purged dummy mock data fallback when Usage Access permission is granted.

          - **Academics Monitoring — Audio, Time & Duration Overhaul:**
            - **Disabled Background Alarm Song:** Eliminated background audio song track completely; notifications use clean, gentle system notification chimes and vibration only.
            - **Accurate Real-Time Study Time at Bottom:** Fixed \`studyTimerDisplay\` to accumulate active study seconds in real time, immediately crediting completed sessions and Day Planner study hours.
            - **12-Hour AM/PM Time Parser:** Fixed regex parsing so afternoon/evening scheduled times (e.g., \"02:30 PM\") are accurately parsed and displayed.
            - **Dynamic Session Duration:** Countdown timer now dynamically reads your scheduled task duration, plus interactive duration selector chips (25m Pomodoro, 45m Deep Work, 60m Standard, 90m Intensive).

          - **Distraction Guardian — System-Wide Blocking & Gesture Navigation Fix:**
            - Removed package name restrictions from \`accessibility_service_config.xml\` so distracting social, streaming, and gaming apps are monitored system-wide.
            - Added detection for casual entertainment videos on YouTube while preserving educational lectures and tutorials.
            - Fixed Gesture Navigation back action by adding a 250ms WindowManager post-dismissal delay before executing \`GLOBAL_ACTION_BACK\`, paired with double-back player collapse and direct previous-app intent return.

          - **Cleaned Features Grid:**
            - Removed the unimplemented Skill Manager tile from the Features hub for a clean, balanced 2x2 grid layout.

          - **100% Offline Capability:**
            - Fully functional offline without requiring an active internet connection.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.5 dist/Productometer.apk --clobber
