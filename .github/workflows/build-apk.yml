name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.3.1 - Ultimate Final Edition

          Refined Alarm Disarm Experience and Real-Time Night Distraction Cap Engine.

          #### 🚀 Highlights in v1.3.1:
          - **🔔 Gentle Notification on Alarm Disarm (No Alarm Ringtones):**
            - Fixed the channel routing bug where disarming the alarm (completing 50 steps or typing verification) fired a secondary alarm ringtone.
            - Alarm victory and mission completion notifications are now routed to a dedicated gentle notification channel (`CHANNEL_ID_GENERAL`) with standard notification chimes and gentle haptic feedback.
            - Bedtime Wind-Down reminders also now strictly use gentle notification chimes rather than full alarm tones.
          - **🌙 Real-Time Night Distraction Cap Engine (15-Minute Cap):**
            - **Sub-Second Accuracy**: Migrated night distraction tracking to Android OS `UsageEvents` bounded between the current bedtime session start and `now`.
            - **Instant Feedback from Second 1**: Displays live seconds (`25s used tonight • 25s / 15m Used`) during early app usage rather than being stuck at `0m`.
            - **Session Isolation**: Automatically resets to `0m` at the beginning of each new bedtime session, preventing stale usage from previous days or daytime app usage from polluting the cap.
            - **Reactive App Resumption**: Added immediate `visibilitychange` and window `focus` listeners so the Sleep Monitoring UI refreshes instantly when returning from other apps.
          - **🚶‍♂️ Dual-Sensor Walking Movement & 50-Step Wakeup Engine Preserved:**
            - `WakeupStepTrackerService` continues to track walking with screen off or phone in pocket and immediately disarms upon reaching 50 steps.
          - **✍️ Conscious Typing Verification Challenge Preserved:**
            - Type `"I am awaken but don't want to walk now so I am using this typing method to disable the alarm"` to disable the alarm immediately.
          - **🛡️ Distraction Blocker & Educational Whitelist Untouched:**
            - 160+ educational keywords and blocker heuristics remain 100% intact.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.3.1 dist/Productometer.apk \
            --title "Productometer v1.3.1 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.3.1 dist/Productometer.apk --clobber
