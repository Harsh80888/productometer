name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.6 dist/Productometer.apk \
            --title "Productometer v1.1.6 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.6

          Major release featuring the new Sleep & Bedtime Monitoring system, interactive Showcase portal, Voice-first AI Coach with 5-turn memory & offline scheduling, and bedtime guardian protection.

          #### 🚀 Highlights in v1.1.6:
          - **🌙 Sleep & Bedtime Monitoring Module:**
            - Calibrated circadian sleep target (7.5h to 9h / 5-6 cycles) with real-time countdown.
            - Brain Activation Smart Alarm requiring a 50-step physical walking routine to disarm.
            - 15-Minute Night Distraction Cap with anti-dopamine grayscale enforcement and emergency pass.
          - **✨ Interactive Showcase Portal:**
            - Hardware and OS architecture documentation with interactive simulators (1-Reel Grace Rule, 48-slot swipe-paint matrix, and Net AP formula playground).
          - **🤖 Voice-First AI Coach with 5-Turn Memory & Offline Scheduling:**
            - Voice-first listening mode with instant switch to chat.
            - 5-prompt rolling conversational memory for context-aware multi-turn task scheduling.
            - Zero-latency offline action engine for scheduling, rescheduling, and category routing.
          - **🛡️ Focus Shield & Accessibility Fixes:**
            - Restored clean compilation in \`ShortsReelsBlockerService.java\` with night distraction tracking.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.6 dist/Productometer.apk --clobber
