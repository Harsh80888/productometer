name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.9

          Major UX & Reliability release fixing the rapid alarm re-ring loop, ensuring the full undisturbed 15-minute grace window for walking, and replacing the direct dismiss button with a Conscious Typing Verification Challenge.

          #### 🚀 Highlights in v1.2.9:
          - **✍️ Conscious Typing Verification Challenge (Replaced Direct Dismiss Button):**
            - The direct one-click dismiss button has been completely removed to prevent lazy snooze habits.
            - To disable the alarm without completing 10 shakes and 50 steps, the user must consciously type the exact verification statement:
              `"I am awaken but don't want to walk now so I am using this typing method to disable the alarm"`
            - Includes live character matching progress and activates the disable button ONLY when 100% exact match is achieved.
            - Wrapped in a smooth ScrollView ensuring comfortable visibility and typing when the soft keyboard is open.
          - **🛑 Eliminated Rapid Alarm Repeat Loop:**
            - Fixed the critical bug where `scheduleNextMorningWakeupAlarm` calculated today's minute and re-triggered an alarm every 3 seconds (firing 4 times in a single minute).
            - `scheduleNextMorningWakeupAlarm` now strictly schedules for tomorrow morning (`target.add(DAY_OF_YEAR, 1)`), giving the user their full, peaceful 15-minute grace period to complete 50 walking steps.
          - **🏃‍♂️ Full 15-Minute Grace for 50-Step Walk:**
            - Shaking 10 times silences the European emergency siren and opens the Running tracker with a 15-minute countdown.
            - Only if 50 steps are not completed after the full 15 minutes will the re-ring alarm sound.
          - **🌙 Bedtime Popup in App-Frozen Style (No Background Activity):**
            - Deep opaque backdrop with two decisive buttons: **⬅️ Return to Home** (kicks distracting apps to home screen) and **📱 Open Productometer**. Strictly no background activity.
          - **🛡️ Distraction Blocker Untouched:**
            - Educational whitelist and detection logic remain 100% intact.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.2.9 dist/Productometer.apk \
            --title "Productometer v1.2.9 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.9 dist/Productometer.apk --clobber
