name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 dist/Productometer.apk \
            --title "Productometer v1.1.0 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.0

          Major release featuring the new in-app AI Coach chatbot integration, exact Digital Wellbeing screen time parity, compulsory daily app limits with 10-minute grace window and freezing, pure Veg Mode in the Diet & Nutrition calculator, and Day Planner reminder badges.

          #### 🚀 Key Features & Enhancements in v1.1.0:
          - **🤖 In-App AI Coach & Chatbot Integration:**
            - Integrated AI Coach assistant across all main modules with edge AI integration via Cloudflare Workers AI.
            - Fast, intelligent context-aware coaching for habits, academics, diet, and productivity.

          - **📱 Exact Screen Time Parity (Digital Wellbeing):**
            - Replaced queryEvents with native Android OS kernel foreground aggregations (UsageStats.getTotalTimeInForeground()).
            - Eliminates phantom phone-lock screen hours, matching Android Digital Wellbeing values precisely.

          - **⏱️ App Daily Time Limits, 10m Grace & Freezing:**
            - Added customizable daily limits per app in Screen Time Manager.
            - Enforced **compulsory limits** for Facebook, Instagram, and all games (detected automatically).
            - **10-minute grace period** with audible chime \`2.mp3\` and live countdown notices before freezing.
            - **App Freezing Overlay** intercepts frozen apps with Return to Home (no bypass).
            - **Strict Immutability:** limits cannot be increased, changed, or disabled during grace period or after freezing.

          - **🥗 Pure Veg Mode in Diet Section:**
            - Added dedicated Pure Veg Mode toggle to filter out eggs, chicken, and non-veg foods from the food catalog and regular meals tray.
            - Iconic FSSAI vegetarian (🟢) and non-vegetarian (🔺) indicator symbols on all food cards and logs.
            - Support for custom food diet classification.

          - **📅 Day Planner Reminder Badges:**
            - Interactive Reminder ON/OFF badge in the Add Task dialog.

          - **100% Offline Capability:**
            - Core tracking, study timers, distraction blocking, and wellbeing analytics remain 100% functional offline.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.0 dist/Productometer.apk --clobber
