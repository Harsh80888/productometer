name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.5 dist/Productometer.apk \
            --title "Productometer v1.1.5 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.5

          Critical fix resolving app usage breakdown rendering and restoring active App Time Limit enforcement.

          #### 🚀 Highlights in v1.1.5:
          - **🛠️ Fixed App Usage Breakdown List Rendering:**
            - Resolved a JavaScript runtime initialization ordering issue where premature dashboard execution halted before rendering the app list.
            - All individual apps and their live tracked usage times are now fully visible in the App & Website Breakdown section.
          - **⏱️ App Daily Time Limits Enforcement:**
            - Upgraded \`getAppTodayForegroundMs\` in \`WebAppInterface\` with multi-tier querying (OS rollup aggregation + \`UsageEvents\` stream) to ensure accurate live usage is always fed to \`ShortsReelsBlockerService\`.
            - Full active enforcement of daily time limits, 10-minute grace window countdown, and frozen app state locks.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.5 dist/Productometer.apk --clobber
