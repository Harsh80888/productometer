name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.8

          Reliability & UX update delivering rock-solid Wake-up Smart Alarm scheduling powered by the Day Planner exact epoch millis engine, preserving the complete Two-Stage Wake-up Mission (10 hard accelerometer shakes + 50 walking steps), and redesigning the Bedtime Dialog into an App-Frozen style popup with strictly no background activity.

          #### 🚀 Highlights in v1.2.8:
          - **⏰ Rock-Solid Wake-up Smart Alarm (Exact Epoch Millis Engine):**
            - Aligned with the proven Day Planner session alarm architecture: JavaScript calculates exact target epoch milliseconds (`targetEpochMillis`) and passes it directly across the NativeBridge.
            - Direct `alarmManager.setExactAndAllowWhileIdle(RTC_WAKEUP, epochMillis, pi)` scheduling wakes CPU from Doze mode across all Android versions (6.0 to 14+) without relying on fragile lock-screen clock widgets.
            - Instant testing support: Setting the alarm to current minute fires reliably within 3 seconds for immediate verification.
            - Removed silent skip guards that caused missed alarms.
          - **🏃‍♂️ Two-Stage Wake-up Mission 100% Intact:**
            - **Phase 1**: Full-screen wake activity with European emergency siren (`880Hz` / `1175Hz` PCM AudioTrack + MediaPlayer). Requires 10 hard physical accelerometer shakes to silence the siren.
            - **Phase 2**: Automatically launches Running module in Health Tracker with a 15-minute countdown requiring 50 physical walking steps. If not completed, re-rings with persistent 5-minute loops.
            - Emergency fail-safe dismiss button available on `AlarmActivity` for unexpected situations.
          - **🌙 Bedtime Popup Overhauled to App-Frozen Style (No Background Activity):**
            - The bedtime popup is now structured and styled identically to the App Frozen dialog (`showAppFrozenDialog`).
            - Impenetrable Cyberpunk backdrop consuming all touch events.
            - Decisive two-button layout: **⬅️ Return to Home** (immediately closes the distracting app and sends user to Android home screen) and **📱 Open Productometer**.
            - Zero loopholes and strictly NO background activity permitted.
          - **🛡️ Distraction Blocker Untouched:**
            - All academic keyword whitelist rules (160+ educational terms) and media control detection remain intact.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.2.8 dist/Productometer.apk \
            --title "Productometer v1.2.8 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.8 dist/Productometer.apk --clobber
