name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.6 dist/Productometer.apk \
            --title "Productometer v1.0.6 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.6

          High-precision update resolving Academics Monitoring linking, exact Digital Wellbeing screen time tracking with sharp 64x64 native app icons, and placing Upcoming Sessions prominently at the top of the Home tab.

          #### 🚀 Key Fixes & Enhancements in v1.0.6:
          - **Academics Monitoring — Full Two-Way Synchronization Restored:**
            - Resolved JavaScript parsing closure syntax error that previously prevented tasks and timer updates from executing.
            - Full two-way reactive linking with Day Planner: scheduled tasks immediately appear in Academics Monitoring, and completing sessions marks tasks as completed in Day Planner.
            - Enhanced \`visibilitychange\` and storage synchronization across views.

          - **Screen Monitoring — High-Precision Tracking & Native App Logos:**
            - Multi-activity reference counting in \`UsageEvents\`: internal app transitions (e.g. YouTube browsing to watching) no longer drop open intervals.
            - Screen lock / timeout detection automatically commits foreground sessions to avoid idle over-counting.
            - Adaptive icon extraction with default dimension fallback guarantees sharp, vibrant 64x64 native app logos for all installed apps.
            - Sub-minute precision: apps used for short sessions display exact seconds (e.g., 45s) rather than displaying 0m.
            - Fixed \`isExcessiveApp\` ReferenceError in app breakdown list.

          - **Home Tab — Upcoming Sessions Visible at First Sight:**
            - Moved Upcoming Sessions directly to the top of the Home tab above the Productivity Score card for immediate visibility upon opening the app.
            - Direct checkbox completion and one-tap Day Planner access.
            - Home screen tile queries real-time screen stats directly on launch.

          - **100% Offline Capability:**
            - Fully functional offline without requiring an active internet connection.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.6 dist/Productometer.apk --clobber
