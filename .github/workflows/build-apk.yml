name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.7 dist/Productometer.apk \
            --title "Productometer v1.0.7 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.7

          Major update featuring session controls (Pause, Take a Break), live ongoing session card on top of the Home tab, audible alarm sounds on the system Alarm stream, exact Digital Wellbeing screen time aggregation, and upgraded Distraction Blocker with 15s casual video delay warning & native Emergency Pass popup.

          #### 🚀 Key Fixes & Enhancements in v1.0.7:
          - **Academics Monitoring — Session Controls & Clear UI:**
            - Added **Pause / Resume** button to temporarily freeze study timer and study seconds accumulator.
            - Added **Take a Break (5m)** button to relax without losing focus progress.
            - Unlocked session notifications are now persisted so you are prompted **only once per session window**, eliminating repeated popups and page refresh flashing.
            - Manual session completion button directly updates the Day Planner schedule.

          - **Live Triggered / Ongoing Focus Session on Home Screen:**
            - Added a live **Active Focus Session Hero Banner** right at the top of the Home tab with a real-time countdown clock, active task title, status badge, and direct button to Academics.
            - Displays an **Unlocked & Ready to Begin** banner whenever a scheduled task arrives.

          - **Alarms Ring Aloud with Sound:**
            - Recreated notification channel on modern Android with explicit alarm ringtone sound and \`AudioAttributes.USAGE_ALARM\`.
            - Directs alarm playback over the dedicated **Alarm Audio Stream**, ensuring reminders ring aloud even if phone notifications or ringers are on vibrate.

          - **Screen Manager — Ground-Truth Aggregation:**
            - Implemented native multi-slice aggregation over \`queryAndAggregateUsageStats\` and daily interval buckets, eliminating discarded slices from system reboots.
            - Total screen time and individual app minutes match Android's system Digital Wellbeing setting exactly.

          - **Distraction Blocker — App Blocking, Autoplay Fix & Emergency Pass:**
            - **YouTube Feed Autoplay Ignored:** Removed inline player checks so scrolling past auto-playing previews in the home feed never triggers alerts.
            - **15-Second Delay Warning:** Casual YouTube videos now grant a 15-second grace window, gently playing warning chime \`2.mp3\` after 15 seconds instead of abruptly navigating back.
            - **Permanently Blocked Apps (WhatsApp, FB, etc.):** When opened, immediately displays the native **Access Intercepted** dialog matching the Me tab test card, featuring \'Return to Focus\' and a **30-second Emergency Pass**.

          - **100% Offline Capability:**
            - Fully functional offline without requiring an active internet connection.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.7 dist/Productometer.apk --clobber
