name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.3.0

          Major Step Tracking & Movement Detection update introducing a dedicated Background Foreground Service (`WakeupStepTrackerService`) with Dual-Sensor Acceleration Peak Detection, ensuring steps are 100% captured even with screen off or phone in pocket, and immediately disarming the alarm upon reaching 50 steps.

          #### 🚀 Highlights in v1.3.0:
          - **🚶‍♂️ Dual-Sensor Walking Movement Engine (`WakeupStepTrackerService`):**
            - Runs as an active Foreground Service with `PARTIAL_WAKE_LOCK`, ensuring continuous step counting even when the phone is locked, screen is off, or kept in pocket.
            - **Universal Accelerometer Peak Detection**: Works on 100% of Android devices without requiring `ACTIVITY_RECOGNITION` permission or dedicated hardware step counters.
            - **Hardware Step Detector Integration**: Automatically synchronizes with hardware step sensors when available for optimal power efficiency.
            - **Live Status Notification**: Displays real-time progress (`🚶‍♂️ Wake-up Mission: X / 50 Steps • Ym left`) with an action to open the conscious typing challenge if needed.
          - **🎉 Immediate Disarm at 50 Steps:**
            - The exact millisecond step 50 is reached, the service disarms the alarm, cancels the re-ring timer, triggers a celebratory vibration, and notifies `🎉 50 Steps Completed! Wake-Up Mission Cleared!`.
            - No more waiting out the 15-minute timer in fear of re-ringing!
          - **✍️ Conscious Typing Verification Alternative:**
            - Type `"I am awaken but don't want to walk now so I am using this typing method to disable the alarm"` to immediately disarm the alarm and stop the step service.
          - **🛑 3-Second Alarm Loop Permanently Eliminated:**
            - Alarms strictly reschedule for tomorrow morning, guaranteeing a peaceful morning routine.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.3.0 dist/Productometer.apk \
            --title "Productometer v1.3.0 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.3.0 dist/Productometer.apk --clobber
