name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.4 dist/Productometer.apk \
            --title "Productometer v1.0.4 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.4

          Major stability & feature update: Academics task list rendering fix, Alarm \"I am ready\" instant start & dismiss, Screen Management proactive permission prompt & syntax resolution, verified Home productivity score engine, and anti-drift GPS.

          #### 🚀 Key Fixes & Features in v1.0.4:
          - **Academics Monitoring Task Rendering Fix:**
            - Resolved JavaScript ReferenceError that was halting script execution; tasks from Day Planner now reliably render into the Academics Monitoring bucket.
            - Broadened categorization so all non-health study, skill, and custom objectives appear in the task bucket with interactive \"Start\" and \"Start Early\" triggers.
            - Completing a 25-minute Pomodoro study block marks the task completed in Day Planner.

          - **Task Alarm \"I am ready\" Option:**
            - Replaced generic dismiss buttons with a prominent **\"✅ I am ready\"** option on both the on-screen alert modal and the native Android notification.
            - Tapping **\"I am ready\"** instantly silences both the native Android alarm ringtone and web audio, closes the alert, and starts the Pomodoro focus countdown session.

          - **Screen Management Proactive Permission Prompt & Syntax Resolution:**
            - Resolved duplicate variable syntax error that was preventing Screen Management scripts from compiling.
            - Added a proactive top-level **Special Permission Card** that asks for Android Usage Access immediately upon opening Screen Management if not already granted.
            - Direct one-tap buttons to **Enable Usage Access** and **Unlock Restricted Settings** for Android 13/14/15.
            - Auto-refreshes and loads live application statistics immediately upon returning from system settings.

          - **Verified Home Productivity Score Formulation:**
            - Refined score formulation to accurately reward completed task hours and tracked live sessions, preventing uncompleted future tasks from prematurely inflating the score.
            - Guaranteed non-negative health workout scores and reset initial dummy screen time so fresh installs start cleanly at a baseline.

          - **100% Offline Capability:**
            - Fully offline-functional without requiring an active internet connection.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.4 dist/Productometer.apk --clobber
