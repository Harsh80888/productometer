name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.3 dist/Productometer.apk \
            --title "Productometer v1.1.3 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.1.3

          Comprehensive major update delivering Digital Wellbeing accuracy, interactive Bedtime Mode & App Limits, Day Planner Future Calendar, and Academics Focus & Break management.

          #### 🚀 Highlights in v1.1.3:
          - **📚 Academics Monitoring:**
            - Strict academic subject filtering excluding chores/fitness from academic tracking.
            - Prominent **Skip Break / Resume Study** button with immediate countdown restoration.
            - Distraction blocker dynamically paused during study breaks and manual pause.
            - Pure cumulative study time tracking without artificial inflation or ticking on breaks.
            - Dynamic notification: \`⏸️ Focus Paused\` and \`☕ Break Time: mm:ss remaining\`.
          - **📅 Day Planner Future Calendar:**
            - Added interactive Calendar ribbon, quick date chips (Today, Tomorrow, +2d, +1w), and full monthly calendar modal.
            - Date-keyed task persistence (\`productometer_planner_tasks_YYYY-MM-DD\`) with glowing task dot indicators.
            - Future alarm scheduling support.
          - **📱 Screen Manager & Digital Wellbeing:**
            - Inbuilt Digital Wellbeing replication using \`UsageEvents\` interactive screen-lock timeline simulation.
            - Interactive **Bedtime Mode** card with start/end time pickers, active countdown, and native sync.
            - Dedicated **App Daily Limits & Parental Controls** with \`+ Set App Limit\` picker, progress bars, grace periods, and freeze states.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.1.3 dist/Productometer.apk --clobber
