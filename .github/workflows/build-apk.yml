name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.2

          Major release featuring the new Sleep & Bedtime Monitoring system, interactive Showcase portal, Voice-first AI Coach with 5-turn memory & offline scheduling, and bedtime guardian protection.

          #### 🚀 Highlights in v1.2.2:
          - **🎓 Truncated Video Title & Study Keyword Fix:**
            - Expanded study detection beyond single word `'Class'` to all major academic keywords (Lecture, Chapter, Lesson, Course, Tutorial, Physics, Chemistry, Math, Biology, CBSE, NCERT, JEE, NEET, OneShot, Revision, etc.).
            - Deep metadata and `contentDescription` inspection captures full unabbreviated titles even when YouTube truncates them with `...`.
            - Added search click memory: tapping a study video in search results automatically verifies and allows playback.
            - 4-second settle grace period allows titles to load without triggering instant false alerts.
            - Added **'Allow This Lecture' (Whitelist)** button on the guardian alert overlay to whitelist lectures with 1 tap.
          - **🌐 Full Android Browser Distraction Blocker:**
            - Added active monitoring across Chrome, Brave, Samsung Internet, Edge, Firefox, and Opera.
            - Automatically blocks YouTube Shorts and non-study videos when browsing on the web.
          - **🎥 Distraction-Free Study Player (Study Tube):**
            - Direct in-app study video player in Academics Monitoring to watch any lecture link distraction-free with zero Shorts and zero recommendations.

          #### 📦 Direct Download:
          - Click **`Productometer.apk`** under Assets below to download and install.
          EOF
          gh release create v1.2.2 dist/Productometer.apk \
            --title "Productometer v1.2.2 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.2 dist/Productometer.apk --clobber
