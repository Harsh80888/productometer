name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.1

          Major release featuring the new Sleep & Bedtime Monitoring system, interactive Showcase portal, Voice-first AI Coach with 5-turn memory & offline scheduling, and bedtime guardian protection.

          #### 🚀 Highlights in v1.2.1:
          - **🎯 YouTube Guard Modes (Lecture Only & Block Shorts):**
            - **Lecture Only Mode:** Exclusively permits study material tracked by the keyword `'Class'`. Blocks all YouTube Shorts and non-study videos.
            - **Block Shorts Mode:** Standard distraction blocker that intercepts YouTube Shorts while preserving full access to standard videos.
            - Quick guard mode toggles available directly on the YouTube app card in Screen Management and in Me Profile.
          - **📱 App Categories (YouTube, Meta, Others, Productivity):**
            - Added first-class classification for **YouTube**, **Meta** (WhatsApp, Instagram, Facebook, Messenger, Threads), **Others**, and **Productivity**.
            - Dedicated filter pills and quick badge reclassification.
          - **📊 Accurate Foreground Screen Time Tracking:**
            - Kernel-level UsageEvents timeline simulation for real-time second-by-second foreground tracking.
          - **🎙️ Voice AI Coach & Lifestyle Guardian:**
            - Sleep & Bedtime monitoring, hybrid cloud diet estimator, and offline schedule management.

          #### 📦 Direct Download:
          - Click **`Productometer.apk`** under Assets below to download and install.
          EOF
          gh release create v1.2.1 dist/Productometer.apk \
            --title "Productometer v1.2.1 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.1 dist/Productometer.apk --clobber
