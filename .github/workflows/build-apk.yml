name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.3.2 - Hardened Banking Isolation & Session Alarms

          Hardened Accessibility Architecture for Banking / UPI App Security and Fixed Day Planner / Academics Session Alarms.

          #### 🚀 Highlights in v1.3.2:
          - **🛡️ Banking & Payment App Safety (Hardened Accessibility Config):**
            - **Removed Gesture Injection Capability**: Completely eliminated `canPerformGestures="true"` from the accessibility service configuration. Banking security engines (Google Pay, PhonePe, Paytm, BHIM, etc.) no longer flag Productometer as an ATS / Auto-Clicker trojan.
            - **Strict Package Isolation**: Defined explicit `android:packageNames` in the accessibility configuration XML targeting only YouTube, social media, video streaming, and web browsers.
            - **Dynamic Banking App Shield**: At runtime, `ShortsReelsBlockerService` immediately ignores and filters out any package matching banking, UPI, or financial keywords (`paytm`, `phonepe`, `paisa`, `bhim`, `upi`, `sbi`, `hdfc`, etc.).
            - **Interactive Windows Flag Removed**: Removed `flagRetrieveInteractiveWindows` and `flagIncludeNotImportantViews` to prevent banking apps from detecting window surveillance.
          - **⏰ Study & Planner Session Alarms Fixed:**
            - **Bridge Parity**: Resolved method naming mismatch by exposing both `scheduleAlarm`/`scheduleTaskAlarm` and `cancelAlarm`/`cancelTaskAlarm` in `WebAppInterface.java` and `native-bridge.js`.
            - **Correct Date Key Calculation**: Fixed Day Planner's date parsing to schedule alarms against the selected planning date (`currentSelectedDateKey`) instead of strictly assuming today.
            - **Android 12+ (API 31+) Compatibility**: Added graceful fallback to `setAndAllowWhileIdle` when exact alarm permissions are restricted, preventing silent `SecurityException` drops.
            - **Full-Screen Alarm Notification**: Configured session alarms with `setFullScreenIntent(true)`, heads-up alert, loud alarm siren, and a dedicated "✅ START SESSION" / "DISMISS" action buttons.
            - **Automatic Startup Alarm Sync**: Day Planner and Academics Monitoring automatically sync all upcoming sessions to Android OS `AlarmManager` upon page load.
            - **Session Completion Chime**: `FocusService` now plays an audible chime and posts a celebratory heads-up notification upon focus timer completion.
          - **🚶‍♂️ Dual-Sensor Walking & Conscious Typing Verification Preserved:**
            - 50-step wakeup tracker and conscious typing challenges remain fully operational.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.3.2 dist/Productometer.apk \
            --title "Productometer v1.3.2 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.3.2 dist/Productometer.apk --clobber
