name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Debug-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 dist/Productometer.apk \
            --title "Productometer v1.0.0 - Android APK" \
            --notes "### 📱 Productometer Android Release v1.0.0

          Download the official Android APK below to install Productometer on your Android device!

          #### 🚀 Highlights:
          - **Screen Time Manager:** Crimson red theme, live device usage, and Academics vs. Others screen ratio bar.
          - **Distraction Blocker:** Schedule Guardian inside Me tab with app permission filters and content-level defense (Shorts, Reels, Games).
          - **Academics & Study Timer:** Real-time study session countdown and audio alarms.
          - **Health & Workout Tracker:** Animated workout exercises and audio guidance.
          - **Immersive Cyberpunk Theme:** High-contrast OLED dark styling.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install on Android." \
            --clobber
