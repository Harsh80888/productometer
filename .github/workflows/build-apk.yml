name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.1 dist/Productometer.apk \
            --title "Productometer v1.0.1 - Android Release APK" \
            --notes "### 📱 Productometer Android Release v1.0.1

          Universal Android Release APK with full offline support and native launcher icon.

          #### 🚀 Enhancements & Compatibility:
          - **Universal Package Support:** Added high-res app launcher icons (\`ic_launcher\`) in all mipmap sizes (\`mdpi\` to \`xxxhdpi\`), resolving package parsing errors on OEM launchers (Xiaomi, Samsung, Realme, OnePlus, Vivo).
          - **Full V1 & V2 Dual-Signing:** Signed with RSA 2048-bit release certificate with JAR and APK Signing Block schemes enabled.
          - **Broad Compatibility:** Minimum Android SDK lowered to Android 5.0 (API 21+), supporting 99.9% of devices.
          - **Crimson Red Screen Time Manager:** Screen time usage, device opens, and Academics vs. Others ratio bar.
          - **Me Tab Distraction Blocker:** Behind 'Distraction blocker' button with 2-way protection modes and Schedule Guardian.
          - **100% Offline Capability:** Operates without any internet connection.

          #### 📦 Direct Download:
          - Click **\`Productometer.apk\`** under Assets below to download and install." || \
          gh release upload v1.0.1 dist/Productometer.apk --clobber
