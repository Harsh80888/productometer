name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Productometer Android Release v1.2.0

          Major release featuring the new Sleep & Bedtime Monitoring system, interactive Showcase portal, Voice-first AI Coach with 5-turn memory & offline scheduling, and bedtime guardian protection.

          #### 🚀 Highlights in v1.2.0:
          - **📊 Real Device Screen Management Restored (v1.1.4 Parity):**
            - Restored the proven `UsageEvents` timeline accumulator simulation in `WebAppInterface.java` with pre-midnight seeding and unlock recovery (`lastKnownPkg`).
            - Intraday app sessions are accurately tracked in real time down to the second.
            - Fallbacks to `queryAndAggregateUsageStats` and rolling 24-hour window protect against zero-time reports.
          - **🥗 Hybrid Cloud AI Custom Food Nutrition Estimator:**
            - AI Coach now automatically queries Cloud AI (Meta Llama 3.3) for any unknown or custom food (e.g. "two biscuits", "a plate of pasta", "a samosa").
            - Automatically extracts calories, protein, carbs, and fat and commits the custom food entry directly into Health Tracker local storage.
            - Expanded offline database for everyday snacks (biscuits, samosas, maggi, cookies, etc.) with 0 ms offline logging.
          - **🌙 Smart Alarm & Circadian Bedtime Guardian:**
            - Dedicated `AlarmActivity` walking routine with step counter sensor integration.
            - Auto-refresh on `onResume`, `focus`, and `visibilitychange` across all modules.

          #### 📦 Direct Download:
          - Click **`Productometer.apk`** under Assets below to download and install.
          EOF
          gh release create v1.2.0 dist/Productometer.apk \
            --title "Productometer v1.2.0 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.0 dist/Productometer.apk --clobber
