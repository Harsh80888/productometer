name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Productometer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias productometer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass productometer123 \
            -keypass productometer123 \
            -dname "CN=Productometer, OU=Productivity, O=Productometer, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Productometer.apk
          ls -lh dist/Productometer.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productometer-Release-APK
          path: dist/Productometer.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
### 📱 Productometer Android Release v1.2.4

          Major release featuring an expanded 160+ Academic Keyword Library, Jetpack Compose-safe active title extraction, intelligent educational creator whitelisting, bedtime smart alarms, and complete distraction blocker coverage.

          #### 🚀 Highlights in v1.2.4:
          - **🎓 160+ Comprehensive Academic Keyword Library:**
            - Spans Physics, Chemistry, Mathematics, Biology, Computer Science/Coding, Engineering, Commerce, Economics, Humanities, and Board exams (CBSE, NCERT, ICSE, State Boards).
            - Competitive exams covered: JEE Mains & Advanced, NEET, UPSC, GATE, CAT, NDA, CLAT, CUET, IIT, AIIMS, BITSAT.
            - Educational creator whitelist: Physics Wallah, Khan Academy, MIT OCW, Stanford, Harvard, CrashCourse, 3Blue1Brown, Veritasium, freeCodeCamp, Gate Smashers, NPTEL, StudyIQ, Drishti IAS, and more.
          - **⚡ Litho & Jetpack Compose Safe Active Title Extraction:**
            - YouTube Android app no longer returns empty titles on modern Compose/Litho layouts.
            - Inspects top watch text nodes while strictly isolating player metadata from recommendations and comments below.
          - **🛡️ Study-First Matching & Clean Entertainment Blacklist:**
            - Academic keyword matching and educational creator whitelisting run FIRST before any entertainment checks.
            - Negative entertainment blacklist sanitized to eliminate collisions (e.g. chemical 'reactions', coding 'challenges', revision 'highlights').
            - Removed home feed trap timer so search and channel browsing remain unhindered.
          - **🌐 Browser Distraction Blocker & Academics Study Player:**
            - Blocks Shorts and non-study videos across Chrome, Brave, Samsung Internet, Edge, Firefox, and Opera.
            - Direct in-app study video player (#studyLectureDialog) in Academics Monitoring.
          - **⏰ Smart Bedtime Wakeup Alarm & Sensor Mission:**
            - Native alarm with dynamic volume crescendo, math/shake morning wake-up missions, and skip/trigger APIs.
          - **📖 Interactive 8-Page Project Writeover:**
            - Complete project documentation, architectural diagrams, hardware bridge specifications, and live showcase links.

          #### 📦 Direct Download:
          - Click **Productometer.apk** under Assets below to download and install.
          EOF
          gh release create v1.2.4 dist/Productometer.apk \
            --title "Productometer v1.2.4 - Android Release APK" \
            --notes-file release_notes.md || \
          gh release upload v1.2.4 dist/Productometer.apk --clobber
